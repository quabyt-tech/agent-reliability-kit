[project]
name = "agent-reliability-kit"
version = "0.1.0"
description = "Eval harness with per-attack-class CI gates, and a production-readiness scorecard for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Quabyt", email = "hello@quabyt.com" }]
keywords = ["llm", "agents", "evals", "ai-safety", "red-teaming", "scorecard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML>=6.0"]

[project.urls]
Homepage = "https://quabyt.com/solutions/agent-reliability"
Repository = "https://github.com/quabyt-tech/agent-reliability-kit"

[project.scripts]
arkit = "agent_reliability_kit.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reliability_kit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
